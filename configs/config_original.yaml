run_name: xai_skinnet_v1
seed: 42

data:
  image_size: 224
  num_classes: 7
  class_names: ["MEL", "NV", "BCC", "AKIEC", "BKL", "DF", "VASC"]
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

model:
  cnn_backbone: efficientnet_b4        # timm model name
  vit_backbone: vit_base_patch16_224   # timm model name
  cnn_feat_dim: 1792
  vit_feat_dim: 768
  fusion_dim: 512
  dropout: 0.4
  pretrained: true
  # Optional third branch: clinical metadata (age/sex/localization from
  # HAM10000_metadata.csv), fused via a 3-way attention gate instead of
  # the paper's plain CNN+ViT pair. Off by default to match the
  # architecture described in the Project Review PDF; flip to true to
  # run it as an ablation/extension. See README "Metadata branch".
  use_metadata: false
  metadata_embed_dim: 64

train:
  epochs: 60
  batch_size: 32
  lr: 2.0e-4
  weight_decay: 1.0e-4
  freeze_epochs: 10       # epochs where only fusion head + last block/branch train
  num_workers: 4
  output_dir: runs
  log_every: 50
  early_stop_patience: 10

augmentation:
  hflip_p: 0.5
  vflip_p: 0.5
  rotation_deg: 30
  color_jitter: 0.2
  random_crop_scale: [0.8, 1.0]
